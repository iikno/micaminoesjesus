name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm test
        env: { SESSION_SECRET: ci-only-session-secret-0123456789abcdef, DB_HOST: x, DB_USER: x, DB_PASS: x, DB_NAME: x, MAIL_DISABLED: '1' }
      - run: npm run build
      - run: docker build -t mcj:ci .
