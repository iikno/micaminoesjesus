# PRODUCTION compose for Coolify (build pack Docker Compose). Variables come from the Coolify UI.
# Do NOT run it locally: Compose would read .env (live RDS credentials). Local dev uses docker-compose.local.yml.
# MySQL is external (AWS RDS); there is no db service.
name: mcj
services:
  app:
    build: .
    restart: unless-stopped
    expose: ['3000']
    environment:
      NODE_ENV: ${NODE_ENV:?}
      PORT: ${PORT:-3000}
      PUBLIC_URL: ${PUBLIC_URL:?}
      TZ: ${TZ:-America/Mexico_City}
      SESSION_SECRET: ${SESSION_SECRET:?}
      DB_HOST: ${DB_HOST:?}
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER:?}
      DB_PASS: ${DB_PASS:?}
      DB_NAME: ${DB_NAME:?}
      DB_SSL: ${DB_SSL:-}
      SMTP_HOST: ${SMTP_HOST:?}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-no-reply@micaminoesjesus.org}
      CONTACT_TO: ${CONTACT_TO:-}
      GC_SITE: ${GC_SITE:-}
      GC_SECRET: ${GC_SECRET:-}
      CLAUDE: ${CLAUDE:-}
      TRANSLATE_PROVIDER: ${TRANSLATE_PROVIDER:-claude}
      TRANSLATE_MODEL: ${TRANSLATE_MODEL:-claude-haiku-5-5}
      TRANSLATE_MONTHLY_LIMIT: ${TRANSLATE_MONTHLY_LIMIT:-100000}
      UPLOADS_DIR: ${UPLOADS_DIR:-/data/uploads}
      UPLOAD_MAX_MB: ${UPLOAD_MAX_MB:-8}
    volumes: [uploads:/data/uploads]
volumes:
  uploads:
